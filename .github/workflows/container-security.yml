name: Container Security

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

concurrency:
  group: container-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: request-hub-security-scan

permissions:
  contents: read

jobs:
  classify-event:
    name: Classify CI event
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      run_full_ci: ${{ steps.route.outputs.run_full_ci }}
    steps:
      - name: Classify CI event
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_full_ci=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/dev ]; then
            response="$RUNNER_TEMP/ci-open-pulls.json"
            if gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f base=master -f "head=${GITHUB_REPOSITORY%%/*}:dev" -f per_page=100 > "$response"; then
              if matched=$(python3 - "$response" <<'PY'
          import json
          import os
          import sys
          try:
              with open(sys.argv[1], encoding='utf-8') as source:
                  pulls = json.load(source)
              if not isinstance(pulls, list):
                  raise ValueError('Expected PR array')
              matched = False
              for pull in pulls:
                  head, base = pull['head'], pull['base']
                  matched |= (
                      pull['state'] == 'open'
                      and head['repo']['full_name'] == os.environ['GITHUB_REPOSITORY']
                      and head['ref'] == 'dev'
                      and head['sha'] == os.environ['GITHUB_SHA']
                      and base['repo']['full_name'] == os.environ['GITHUB_REPOSITORY']
                      and base['ref'] == 'master'
                  )
              print('true' if matched else 'false')
          except (OSError, ValueError, KeyError, TypeError):
              raise SystemExit('PR lookup response could not be validated')
          PY
              ); then
                if [ "$matched" = true ]; then
                  run_full_ci=false
                fi
              else
                echo '::notice::PR response validation failed; running full CI.'
              fi
            else
              echo '::notice::PR lookup failed; running full CI.'
            fi
            rm -f "$response"
          fi
          echo "run_full_ci=$run_full_ci" >> "$GITHUB_OUTPUT"
          if [ "$run_full_ci" = false ]; then
            echo 'Full CI is running on the open master PR merge ref for this dev commit. This branch routing result is not PR validation.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Full CI required for this event.' >> "$GITHUB_STEP_SUMMARY"
          fi

  workflow-validation:
    name: Workflow and shell validation
    needs: classify-event
    if: ${{ !cancelled() && (needs.classify-event.result != 'success' || needs.classify-event.outputs.run_full_ci != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate workflow syntax
        run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace
          rhysd/actionlint:1.7.11@sha256:5457037ba91acd225478edac3d4b32e45cf6c10291e0dabbfd2491c63129afe1
          -shellcheck=

      - name: Validate production shell scripts
        run: |
          bash -n scripts/deploy-production.sh scripts/migrate-production.sh scripts/smoke-container.sh
          docker run --rm -v "$PWD:/workspace" -w /workspace koalaman/shellcheck:v0.11.0@sha256:b9389b73c8f26f710a7171cb7d8848a34a9c1e07a7865e727c9ec4ce99f9a83f --severity=warning scripts/deploy-production.sh scripts/migrate-production.sh scripts/smoke-container.sh

  changelog-evidence:
    name: Prepare release screenshot evidence
    needs: classify-event
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted master commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up changelog capture Python
        id: capture_python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-changelog-capture.txt

      - name: Restore historical capture cache
        uses: actions/cache@v4
        with:
          path: |
            hub/changelog_assets/automatic/
            .changelog-capture-vendor/
          key: release-evidence-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: release-evidence-${{ runner.os }}-

      - name: Generate release changelog manifest
        id: changelog_manifest
        run: python -m hub.release_changelog --version next --revision "$GITHUB_SHA"

      - name: Restore Chromium cache
        id: browser_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: capture-browser-${{ runner.os }}-${{ hashFiles('requirements-changelog-capture.txt') }}

      - name: Install isolated changelog capture tools
        id: capture_tools
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python -m venv "$RUNNER_TEMP/changelog-capture"
          "$RUNNER_TEMP/changelog-capture/bin/python" -m pip install --require-hashes -r requirements-changelog-capture.txt
          "$RUNNER_TEMP/changelog-capture/bin/python" -m pip check
          "$RUNNER_TEMP/changelog-capture/bin/python" -m playwright install --with-deps chromium
          echo "$RUNNER_TEMP/changelog-capture/bin" >> "$GITHUB_PATH"

      - name: Capture release changelog screenshots
        if: steps.changelog_manifest.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          CAPTURE_SETUP_OUTCOME: ${{ steps.capture_tools.outcome }}
        run: |
          export CAPTURE_FAILURE_REASON="Capture did not complete; retry automatic capture or add evidence in Management."
          if [ "$CAPTURE_SETUP_OUTCOME" = "success" ]; then
            if python scripts/capture_release_changelog.py --prepare-assets; then
              if ! timeout 8m python scripts/capture_release_changelog.py; then
                echo "::warning::Some changelog screenshots could not be captured; deployment continues."
              fi
            else
              export CAPTURE_FAILURE_REASON="Offline screenshot assets could not be prepared; retry capture."
            fi
          else
            export CAPTURE_FAILURE_REASON="Screenshot capture tools could not be installed; retry capture."
          fi
          python - <<'PY'
          import json
          import os
          from hub.release_changelog import MANIFEST_PATH, missing_comparisons, validate_manifest

          manifest = validate_manifest(json.loads(MANIFEST_PATH.read_text(encoding="utf-8")))
          missing = [item for item in manifest["commits"] if missing_comparisons([item], require_all=True)]
          for item in missing:
              if not item.get("capture_error"):
                  item["capture_error"] = os.environ["CAPTURE_FAILURE_REASON"]
          temporary = MANIFEST_PATH.with_suffix(".json.tmp")
          temporary.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          temporary.replace(MANIFEST_PATH)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"## Changelog screenshots\n{len(manifest['commits']) - len(missing)} complete; {len(missing)} need evidence.\n")
              summary.write("Missing evidence holds publication only; deployment continues.\n")
              for item in missing:
                  summary.write(f"- `{item['sha'][:12]}`: {item['capture_error']}\n")
          raise SystemExit(1 if missing else 0)
          PY

      - name: Run historical capture regression tests
        if: steps.capture_tools.outcome == 'success'
        run: |
          python scripts/capture_release_changelog.py --prepare-assets
          python -m unittest discover -s scripts -p test_capture_release_changelog.py

      - name: Package exact-run screenshot evidence
        if: ${{ !cancelled() && steps.changelog_manifest.outcome == 'success' }}
        run: |
          python scripts/release_evidence.py export --bundle "$RUNNER_TEMP/release-evidence" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          mkdir -p hub/changelog_assets/automatic
          cp hub/release_changelog_manifest.json hub/changelog_assets/automatic/manifest.json

      - name: Retain changelog capture evidence
        if: ${{ !cancelled() && steps.changelog_manifest.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: changelog-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error
          retention-days: 30

  django-validation:
    name: Django Validation
    needs: classify-event
    if: ${{ !cancelled() && (needs.classify-event.result != 'success' || needs.classify-event.outputs.run_full_ci != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: request_hub_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d request_hub_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: 'True'
      DJANGO_SECRET_KEY: ci-only-nonproduction-key-for-disposable-tests-0123456789abcdef
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_PUBLIC_BASE_URL: https://esgrequesthub.com
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: request_hub_ci
      DB_USER: postgres
      DB_PASSWORD: ci-only-password
      DB_SSLMODE: disable
      DB_CONN_MAX_AGE: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock -r requirements-ci.txt
          python -m pip check

      - name: Check Django configuration
        run: python manage.py check

      - name: Check production security configuration
        env:
          DJANGO_DEBUG: 'False'
        run: python manage.py check --deploy --fail-level WARNING

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Run fast regression checks
        run: |
          python -m unittest discover -s scripts -p test_analyze_actions_runs.py
          python -m unittest discover -s scripts -p test_changelog_capture_workflow.py
          python -m unittest discover -s scripts -p test_release_evidence.py
          python -m unittest discover -s scripts -p test_container_smoke.py
          node --test scripts_check/test_notification_toasts.cjs
          bash scripts/test-deploy-production.sh
          bash scripts/test-ci-routing.sh
          bash scripts/test-release-preflight.sh

      # Keep tests serial until the earlier parallel-run failures are understood.
      # The fast test-only password hasher does not affect deployment checks.
      - name: Run application tests
        run: >-
          python manage.py test
          --settings=request_hub.settings_ci
          --durations 10
          --noinput
          --verbosity 2

  dependency-audit:
    name: Python dependency audit
    needs: classify-event
    if: ${{ !cancelled() && (needs.classify-event.result != 'success' || needs.classify-event.outputs.run_full_ci != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tooling.txt

      - name: Install audit tooling
        run: |
          python -m pip install --require-hashes -r requirements-tooling.txt
          python -m pip check

      - name: Audit locked dependencies
        run: pip-audit --require-hashes -r requirements.lock

  image-scan:
    name: Build, scan, and publish SBOM
    needs: classify-event
    if: ${{ !cancelled() && (needs.classify-event.result != 'success' || needs.classify-event.outputs.run_full_ci != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Dependency layers come from the Actions cache; OS packages are always
      # refreshed through APK_REFRESH so security fixes are never cached away.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          pull: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=request-hub-image
          cache-to: type=gha,scope=request-hub-image,mode=max,ignore-error=true
          build-args: |
            APP_VERSION=${{ github.sha }}
            VCS_REF=${{ steps.meta.outputs.revision }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            APK_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Smoke-test built container
        run: bash scripts/smoke-container.sh "$IMAGE_NAME:$GITHUB_SHA" "$GITHUB_SHA"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: request-hub-sbom.spdx.json

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy report artifact
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: request-hub-trivy-results
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Upload SBOM artifact
        if: ${{ !cancelled() && hashFiles('request-hub-sbom.spdx.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: request-hub-sbom
          path: request-hub-sbom.spdx.json
          if-no-files-found: error
          retention-days: 14
