name: Container Security

on:
  pull_request:
    paths:
      - Dockerfile
      - requirements*.txt
      - requirements*.lock
      - .dockerignore
      - .github/workflows/container-security.yml
  push:
    branches:
      - main
      - dev
      - master
    paths:
      - Dockerfile
      - requirements*.txt
      - requirements*.lock
      - .dockerignore
      - .github/workflows/container-security.yml
  workflow_dispatch:

concurrency:
  group: container-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: request-hub-security-scan

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit locked dependencies
        run: pip-audit -r requirements.lock

  image-scan:
    name: Build, scan, and publish SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          pull: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            VCS_REF=${{ steps.meta.outputs.revision }}
            BUILD_DATE=${{ steps.meta.outputs.created }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: request-hub-sbom.spdx.json

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy report artifact
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: request-hub-trivy-results
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Upload SBOM artifact
        if: ${{ !cancelled() && hashFiles('request-hub-sbom.spdx.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: request-hub-sbom
          path: request-hub-sbom.spdx.json
          if-no-files-found: error
          retention-days: 14
