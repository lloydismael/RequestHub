name: Container Security

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

concurrency:
  group: container-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: request-hub-security-scan

permissions:
  contents: read

jobs:
  django-validation:
    name: Django Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: request_hub_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d request_hub_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: 'True'
      DJANGO_SECRET_KEY: ci-only-nonproduction-key-for-disposable-tests-0123456789abcdef
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_PUBLIC_BASE_URL: https://esgrequesthub.com
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: request_hub_ci
      DB_USER: postgres
      DB_PASSWORD: ci-only-password
      DB_SSLMODE: disable
      DB_CONN_MAX_AGE: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Check Django configuration
        run: python manage.py check

      - name: Check production security configuration
        env:
          DJANGO_DEBUG: 'False'
        run: python manage.py check --deploy --fail-level WARNING

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      # Test-only settings use a fast password hasher; the checks above run against
      # the real settings. Tests run in parallel across the runner's CPUs.
      - name: Run application tests
        run: >-
          python manage.py test
          --settings=request_hub.settings_ci
          --parallel auto
          --durations 10
          --noinput
          --verbosity 2

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit locked dependencies
        run: pip-audit -r requirements.lock

  image-scan:
    name: Build, scan, and publish SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Dependency layers come from the Actions cache; OS packages are always
      # refreshed through APK_REFRESH so security fixes are never cached away.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          pull: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=request-hub-image
          cache-to: type=gha,scope=request-hub-image,mode=max,ignore-error=true
          build-args: |
            APP_VERSION=${{ github.sha }}
            VCS_REF=${{ steps.meta.outputs.revision }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            APK_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: request-hub-sbom.spdx.json

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy report artifact
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: request-hub-trivy-results
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Upload SBOM artifact
        if: ${{ !cancelled() && hashFiles('request-hub-sbom.spdx.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: request-hub-sbom
          path: request-hub-sbom.spdx.json
          if-no-files-found: error
          retention-days: 14
