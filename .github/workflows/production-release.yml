name: Production Release

on:
  workflow_run:
    workflows: [Container Security]
    types: [completed]
    branches: [master]

concurrency:
  group: request-hub-production-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: lloydismael12/request-hub

jobs:
  release-preflight:
    name: Check release eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Explain release eligibility
        id: check
        env:
          CD_ENABLED: ${{ vars.CD_ENABLED }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          ready=true
          echo '## Production release eligibility' >> "$GITHUB_STEP_SUMMARY"
          if [ "$CD_ENABLED" != true ]; then
            echo '- DISABLED: repository variable CD_ENABLED must equal true.' >> "$GITHUB_STEP_SUMMARY"
            echo '::notice::CD is disabled. Configure production prerequisites before enabling CD_ENABLED.'
            ready=false
          fi
          check_condition() {
            if [ "$2" = "$3" ]; then
              printf -- '- PASS: %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            else
              printf -- '- INELIGIBLE: %s (actual: %s; required: %s)\n' "$1" "${2:-unset}" "$3" >> "$GITHUB_STEP_SUMMARY"
              echo "::notice::$1 is not satisfied; production deployment remains disabled."
              ready=false
            fi
          }
          check_condition 'Upstream CI result' "$CI_CONCLUSION" success
          check_condition 'Upstream CI event' "$CI_EVENT" push
          check_condition 'Upstream CI branch' "$CI_BRANCH" master
          check_condition 'Upstream repository' "$CI_REPOSITORY" "$GITHUB_REPOSITORY"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = false ]; then
            echo 'No image will be published or deployed. See docs/cd-workflow-testing.md for setup.' >> "$GITHUB_STEP_SUMMARY"
          fi

  production-configuration:
    name: Check production configuration
    needs: release-preflight
    if: needs.release-preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - name: Validate required configuration without exposing values
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_MAIN_CONTAINER: ${{ vars.AZURE_MAIN_CONTAINER }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=false
          echo '## Production configuration' >> "$GITHUB_STEP_SUMMARY"
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_WEBAPP_NAME AZURE_MAIN_CONTAINER PRODUCTION_URL DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing configuration: $name"
              printf -- '- MISSING: %s\n' "$name" >> "$GITHUB_STEP_SUMMARY"
              missing=true
            fi
          done
          if [ "$missing" = true ]; then
            echo 'No image will be published. Configure Azure variables in the production environment and Docker Hub secrets at repository scope.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ ! "$PRODUCTION_URL" =~ ^https://[^/]+$ ]]; then
            echo '::error::PRODUCTION_URL must be an HTTPS origin without a trailing slash.'
            exit 1
          fi
          echo 'Required values are present. Runner availability, credentials, networking, and backups still require independent verification.' >> "$GITHUB_STEP_SUMMARY"

  release-image:
    name: Build and publish numbered release
    needs: [release-preflight, production-configuration]
    if: needs.release-preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
      revision: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Reject superseded release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)" = "$RELEASE_SHA"

      - name: Check out release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Allocate next numbered tag
        id: version
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          url = 'https://hub.docker.com/v2/repositories/lloydismael12/request-hub/tags?page_size=100'
          versions = []
          while url:
              if not url.startswith('https://hub.docker.com/v2/repositories/lloydismael12/request-hub/tags'):
                  raise SystemExit('Unexpected registry pagination URL')
              with urllib.request.urlopen(url, timeout=30) as response:
                  page = json.load(response)
              for tag in page['results']:
                  match = re.fullmatch(r'v(\d+)\.([0-9])', tag['name'])
                  if match:
                      versions.append(tuple(map(int, match.groups())))
              url = page.get('next')
          if not versions:
              raise SystemExit('No numbered release baseline found; refusing allocation')
          major, patch = max(versions)
          major, patch = (major + 1, 0) if patch == 9 else (major, patch + 1)
          version = f'v{major}.{patch}'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\n')
          print(f'Allocated {version}; latest will not be changed')
          PY

      - name: Build release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          pull: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.event.workflow_run.head_sha }}

      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          format: spdx-json
          output-file: release-sbom.spdx.json

      - name: Scan release image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          format: sarif
          output: release-trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

      - name: Upload release evidence
        if: ${{ !cancelled() && hashFiles('release-sbom.spdx.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-security-evidence
          path: |
            release-sbom.spdx.json
            release-trivy.sarif
          retention-days: 30

      - name: Reject release superseded during build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)" = "$RELEASE_SHA"

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish scanned image without rebuilding
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)" = "$RELEASE_SHA"
          if docker manifest inspect "$IMAGE_NAME:$VERSION" >/dev/null 2>&1; then
            echo 'Release tag already exists; refusing to overwrite it' >&2
            exit 1
          fi
          docker push "$IMAGE_NAME:$VERSION"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_NAME:$VERSION")
          test "${digest%%@*}" = "$IMAGE_NAME"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Migrate and update production image
    needs: release-image
    runs-on: ${{ fromJSON('["self-hosted", "Linux", "X64", "request-hub-production"]') }}
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.release-image.outputs.revision }}
      RELEASE_VERSION: ${{ needs.release-image.outputs.version }}
      RELEASE_DIGEST: ${{ needs.release-image.outputs.digest }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_MAIN_CONTAINER: ${{ vars.AZURE_MAIN_CONTAINER }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Check out trusted release
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-image.outputs.revision }}
          persist-credentials: false

      - name: Verify release and runner prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)" = "$RELEASE_SHA"
          test -r /opt/request-hub/production.env
          test -x /opt/request-hub/verify-backup
          test -z "$(find /opt/request-hub/production.env -perm /077 -print)"
          /opt/request-hub/verify-backup

      - name: Sign in to Azure using federation
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run controlled deployment and rollback checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/deploy-production.sh