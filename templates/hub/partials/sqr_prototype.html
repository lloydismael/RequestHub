{# Lazy shell for the SQR Tracker Prototype: records are fetched when the view is first opened. #}
<section id="sqr-proto" class="sqr-proto" data-sqr-view-panel="prototype" hidden
         data-endpoint="{% url 'hub:sqr-prototype-data' %}" data-csrf="{{ csrf_token }}"
         data-default-mine="{% if default_my_assigned_filter %}1{% else %}0{% endif %}"
         aria-label="SQR Tracker Prototype">
    <div id="sqr-proto-pipeline" class="sqr-proto__pipeline" role="group" aria-label="Filter by pipeline stage"></div>

    <div class="sqr-proto__body" id="sqr-proto-body" data-mode="list">
        <aside class="sqr-proto__list" aria-label="SQR list">
            <div class="sqr-proto__tools">
                <label class="visually-hidden" for="sqr-proto-search">Search SQRs</label>
                <div class="sqr-proto__search">
                    <i class="bi bi-search" aria-hidden="true"></i>
                    <input type="search" id="sqr-proto-search" placeholder="Search ID, account, service, people…" autocomplete="off">
                </div>
                <div class="sqr-proto__tool-row">
                    <div>
                        <label class="visually-hidden" for="sqr-proto-status">SQR status</label>
                        <select id="sqr-proto-status" class="form-select form-select-sm">
                            <option value="">Any status</option>
                            <option value="submitted">For Processing</option>
                            <option value="for_revision">For Revision</option>
                            <option value="reviewed">Approved</option>
                        </select>
                    </div>
                    <div>
                        <label class="visually-hidden" for="sqr-proto-sort">Sort by</label>
                        <select id="sqr-proto-sort" class="form-select form-select-sm">
                            <option value="attention">Needs attention first</option>
                            <option value="newest">Newest first</option>
                            <option value="oldest">Oldest first</option>
                            <option value="value">Highest value</option>
                            <option value="target">Nearest target date</option>
                        </select>
                    </div>
                </div>
                <div class="sqr-proto__tool-row sqr-proto__tool-row--between">
                    <label class="sqr-proto__check" id="sqr-proto-mine-wrap" hidden>
                        <input type="checkbox" id="sqr-proto-mine"> <span>Assigned to me</span>
                    </label>
                    <div class="sqr-proto__density" role="group" aria-label="List density">
                        <button type="button" data-density="comfortable" aria-pressed="true" title="Comfortable"><i class="bi bi-view-stacked" aria-hidden="true"></i><span class="visually-hidden">Comfortable</span></button>
                        <button type="button" data-density="compact" aria-pressed="false" title="Compact"><i class="bi bi-list-ul" aria-hidden="true"></i><span class="visually-hidden">Compact</span></button>
                    </div>
                    <button type="button" class="sqr-proto__link" id="sqr-proto-reset">Reset</button>
                </div>
            </div>
            <p class="sqr-proto__count" id="sqr-proto-count" role="status" aria-live="polite">Loading…</p>
            <ul class="sqr-proto__items" id="sqr-proto-items"></ul>
            <button type="button" class="btn btn-outline-primary sqr-proto__more" id="sqr-proto-more" hidden>Show more</button>
        </aside>

        <section class="sqr-proto__editor" id="sqr-proto-editor" aria-label="SQR record">
            <div class="sqr-proto__empty">
                <i class="bi bi-clipboard-check" aria-hidden="true"></i>
                <h3>Select an SQR</h3>
            </div>
        </section>
    </div>

    <div class="sqr-proto__toast" id="sqr-proto-toast" role="status" aria-live="polite" hidden>
        <span id="sqr-proto-toast-text"></span>
        <button type="button" class="sqr-proto__link" id="sqr-proto-toast-undo" hidden><i class="bi bi-arrow-counterclockwise me-1" aria-hidden="true"></i>Undo</button>
        <button type="button" class="sqr-proto__icon-btn" id="sqr-proto-toast-close" aria-label="Dismiss"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
    </div>

    <dialog class="sqr-proto__dialog" id="sqr-proto-approve" aria-labelledby="sqr-proto-approve-title">
        <form method="dialog">
            <h3 id="sqr-proto-approve-title"><i class="bi bi-patch-check me-2" aria-hidden="true"></i>Approve this SQR</h3>
            <p>This starts the 45-day validity window.</p>
            <div class="sqr-proto__dialog-actions sqr-proto__dialog-actions--stack">
                <button type="button" class="btn btn-primary" data-approve="draft"><i class="bi bi-envelope-open me-2" aria-hidden="true"></i>Approve and open Outlook draft</button>
                <button type="button" class="btn btn-outline-primary" data-approve="eml"><i class="bi bi-download me-2" aria-hidden="true"></i>Approve and download .eml</button>
                <button type="submit" class="btn btn-link" value="cancel">Cancel</button>
            </div>
        </form>
    </dialog>

    <dialog class="sqr-proto__dialog" id="sqr-proto-revise" aria-labelledby="sqr-proto-revise-title">
        <form method="dialog">
            <h3 id="sqr-proto-revise-title"><i class="bi bi-arrow-repeat me-2" aria-hidden="true"></i>Request a revision</h3>
            <label class="form-label" for="sqr-proto-revise-notes">What needs to change?</label>
            <textarea id="sqr-proto-revise-notes" class="form-control" rows="5" required></textarea>
            <p class="sqr-proto__field-error" id="sqr-proto-revise-error" role="alert" hidden>Add a comment before sending.</p>
            <div class="sqr-proto__dialog-actions">
                <button type="submit" class="btn btn-outline-secondary" value="cancel" formnovalidate>Cancel</button>
                <button type="button" class="btn btn-primary" data-revise="confirm">Send for revision</button>
            </div>
        </form>
    </dialog>
</section>
