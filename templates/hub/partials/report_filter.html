<details class="rpt-filters"{% if period_range_swapped %} open{% endif %}>
    <summary>
        <span class="rpt-filter-label"><i class="bi bi-sliders" aria-hidden="true"></i> Filters <i class="bi bi-chevron-down" aria-hidden="true"></i></span>
        <span class="rpt-filter-period"><i class="bi bi-calendar3" aria-hidden="true"></i> {% if report_view == 'activity' %}Dated:{% else %}Created:{% endif %} {{ period_label }}</span>
    </summary>
    <form method="get" class="rpt-filter-form">
        <input type="hidden" name="report_view" value="{{ report_view }}">
        <div>
            <label class="form-label" for="report-start-month">Start month</label>
            <input class="form-control" type="month" id="report-start-month" name="start_month" value="{{ period_start_month }}">
        </div>
        <div>
            <label class="form-label" for="report-end-month">End month</label>
            <input class="form-control" type="month" id="report-end-month" name="end_month" value="{{ period_end_month }}">
        </div>
        <div class="rpt-filter-actions">
            <button type="submit" class="btn rpt-primary">Apply</button>
            <a class="btn btn-outline-secondary" href="?report_view={{ report_view }}">Clear</a>
        </div>
        {% if period_range_swapped %}
            <p class="rpt-range-hint mb-0"><i class="bi bi-exclamation-triangle" aria-hidden="true"></i> Range was reversed; the months have been swapped.</p>
        {% endif %}
    </form>
</details>
