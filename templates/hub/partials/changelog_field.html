<div class="cl-field">
    <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="form-text mb-0">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="text-danger small mt-1 mb-0" role="alert">{{ error }}</p>{% endfor %}
</div>
