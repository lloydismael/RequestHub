<td class="{% if is_pm %}sqr-inline-cell{% endif %}" {% if is_pm %}data-sqr-pk="{{ item.pk }}" data-sqr-field="{{ field }}" data-sqr-type="select" data-sqr-value="{{ value|default:'' }}"{% endif %}>
    <span class="sqr-display">
        {% if value == 'on_track' or value == 'within_budget' or value == 'met' %}
            <span class="badge bg-success-subtle text-success border border-success-subtle">{{ label }}</span>
        {% elif value == 'at_risk' %}
            <span class="badge bg-warning-subtle text-warning border border-warning-subtle">{{ label }}</span>
        {% elif value == 'delayed' or value == 'over_budget' or value == 'unmet' %}
            <span class="badge bg-danger-subtle text-danger border border-danger-subtle">{{ label }}</span>
        {% else %}
            <span class="text-muted small">N/R</span>
        {% endif %}
    </span>
</td>
