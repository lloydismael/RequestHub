<td class="small{% if editable %} sqr-inline-cell{% endif %}"{% if editable %} data-sqr-pk="{{ item.pk }}" data-sqr-field="{{ field }}" data-sqr-type="select" data-sqr-value="{{ value|default:'' }}"{% endif %}>
    <span class="sqr-display">
        {% if value == green %}
            <span class="badge bg-success-subtle text-success border border-success-subtle">{{ green_label }}</span>
        {% elif value == 'at_risk' %}
            <span class="badge bg-warning-subtle text-warning border border-warning-subtle">At Risk</span>
        {% elif value == red %}
            <span class="badge bg-danger-subtle text-danger border border-danger-subtle">{{ red_label }}</span>
        {% else %}
            <span class="text-muted small"{% if value %} title="Invalid recorded assessment; review in Delivery Progress."{% endif %}>Not assessed{% if value %} (review required){% endif %}</span>
        {% endif %}
    </span>
</td>
